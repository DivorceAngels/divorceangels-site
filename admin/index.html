<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divorce Angels — Content Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* AI Writer Panel */
    #ai-writer {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10000;
      font-family: 'DM Sans', sans-serif;
    }
    #ai-toggle {
      background: #2C3E35;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 40px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(44,62,53,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #ai-toggle:hover { background: #4A7A5E; }
    #ai-panel {
      display: none;
      position: fixed;
      bottom: 80px;
      right: 24px;
      width: 420px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.15);
      border: 1px solid #D8E4DC;
      overflow: hidden;
      z-index: 10000;
    }
    #ai-panel.open { display: flex; flex-direction: column; }
    .ai-hdr {
      background: #2C3E35;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ai-hdr h3 { color: white; font-family: 'DM Serif Display', serif; font-size: 1.1rem; font-weight: 400; margin: 0; }
    .ai-hdr span { color: rgba(255,255,255,0.5); font-size: 0.75rem; }
    .ai-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .ai-body label { font-size: 0.8rem; font-weight: 500; color: #3A4E42; margin-bottom: 4px; display: block; }
    .ai-body input, .ai-body select, .ai-body textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #D8E4DC;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: #1A2018;
      outline: none;
      box-sizing: border-box;
    }
    .ai-body input:focus, .ai-body select:focus, .ai-body textarea:focus { border-color: #4A7A5E; }
    .ai-body textarea { resize: vertical; min-height: 80px; }
    .ai-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .ai-chip {
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #D8E4DC;
      color: #3A4E42;
      cursor: pointer;
      background: white;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .ai-chip:hover { background: #E4EFE8; border-color: #4A7A5E; }
    #ai-generate {
      background: #2C3E35;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    #ai-generate:hover { background: #4A7A5E; }
    #ai-generate:disabled { opacity: 0.6; cursor: not-allowed; }
    #ai-output {
      display: none;
      padding: 0 20px 20px;
      flex-direction: column;
      gap: 10px;
    }
    #ai-output.show { display: flex; }
    #ai-result {
      background: #F2F7F4;
      border: 1px solid #D8E4DC;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.84rem;
      color: #3A4E42;
      line-height: 1.7;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .ai-actions { display: flex; gap: 8px; }
    .ai-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    #ai-copy { background: #E4EFE8; border: 1px solid #C8D8CD; color: #2C3E35; }
    #ai-copy:hover { background: #C8D8CD; }
    #ai-regen { background: white; border: 1px solid #D8E4DC; color: #3A4E42; }
    #ai-regen:hover { background: #F2F7F4; }
    .ai-note { font-size: 0.72rem; color: #6A7A70; text-align: center; }
  </style>
</head>
<body>

  <!-- Netlify CMS -->
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>

  <!-- AI Blog Writer -->
  <div id="ai-writer">
    <button id="ai-toggle" onclick="toggleAI()">✦ AI Blog Writer</button>
  </div>

  <div id="ai-panel">
    <div class="ai-hdr">
      <h3>✦ AI Blog Writer</h3>
      <span>Powered by Claude</span>
    </div>
    <div class="ai-body">
      <div>
        <label>What do you want to write about?</label>
        <input type="text" id="ai-topic" placeholder="e.g. How to handle finances during separation">
      </div>
      <div>
        <label>Quick topic ideas</label>
        <div class="ai-chips">
          <button class="ai-chip" onclick="setTopic('Protecting yourself financially before filing for divorce')">Protecting finances</button>
          <button class="ai-chip" onclick="setTopic('How to tell your kids about the divorce')">Telling the kids</button>
          <button class="ai-chip" onclick="setTopic('Dating after divorce in your 40s and 50s')">Dating after divorce</button>
          <button class="ai-chip" onclick="setTopic('What to expect in your first lawyer meeting')">First lawyer meeting</button>
          <button class="ai-chip" onclick="setTopic('How to cope with loneliness after divorce')">Loneliness & healing</button>
          <button class="ai-chip" onclick="setTopic('Co-parenting tips during the holidays')">Holiday co-parenting</button>
        </div>
      </div>
      <div>
        <label>Category</label>
        <select id="ai-category">
          <option value="Legal">Legal</option>
          <option value="Financial">Financial</option>
          <option value="Co-Parenting">Co-Parenting</option>
          <option value="Emotional">Emotional</option>
          <option value="Life After">Life After</option>
          <option value="Wellness">Wellness</option>
        </select>
      </div>
      <div>
        <label>Tone / angle (optional)</label>
        <textarea id="ai-angle" placeholder="e.g. Personal and warm, written for someone just starting the process. Include practical tips."></textarea>
      </div>
      <button id="ai-generate" onclick="generatePost()">✦ Generate blog post</button>
    </div>
    <div id="ai-output">
      <div id="ai-image-suggestion" style="display:none;margin-bottom:10px;">
        <div style="font-size:0.8rem;font-weight:500;color:#3A4E42;margin-bottom:6px;">Suggested cover image</div>
        <div style="position:relative;border-radius:8px;overflow:hidden;border:1px solid #D8E4DC;">
          <img id="ai-cover-img" src="" style="width:100%;height:120px;object-fit:cover;display:block;">
          <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.5);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:0.68rem;color:rgba(255,255,255,0.7);">Via Unsplash — free to use</span>
            <button onclick="refreshImage()" style="font-size:0.68rem;color:white;background:rgba(255,255,255,0.2);border:none;padding:3px 8px;border-radius:4px;cursor:pointer;">Try another</button>
          </div>
        </div>
        <div style="font-size:0.72rem;color:#6A7A70;margin-top:5px;">Copy this URL to use as your cover image:</div>
        <input id="ai-img-url" type="text" readonly style="width:100%;padding:6px 10px;font-size:0.72rem;border:1px solid #D8E4DC;border-radius:6px;color:#3A4E42;margin-top:4px;cursor:pointer;" onclick="this.select();document.execCommand('copy');this.style.borderColor='#4A7A5E';" title="Click to copy">
      </div>
      <div id="ai-result"></div>
      <div class="ai-actions">
        <button id="ai-copy" onclick="copyPost()">Copy to clipboard</button>
        <button id="ai-regen" onclick="generatePost()">Regenerate</button>
      </div>
      <div class="ai-note">Copy the post and image URL into the blog editor above, then publish.</div>
    </div>
  </div>

  <script>
    function toggleAI() {
      const p = document.getElementById('ai-panel');
      p.classList.toggle('open');
    }

    function setTopic(topic) {
      document.getElementById('ai-topic').value = topic;
    }

    async function generatePost() {
      const topic = document.getElementById('ai-topic').value.trim();
      const category = document.getElementById('ai-category').value;
      const angle = document.getElementById('ai-angle').value.trim();

      if (!topic) {
        alert('Please enter a topic first.');
        return;
      }

      const btn = document.getElementById('ai-generate');
      const output = document.getElementById('ai-output');
      const result = document.getElementById('ai-result');

      btn.disabled = true;
      btn.textContent = '✦ Writing your post...';
      result.textContent = '';
      output.classList.remove('show');

      const prompt = `Write a blog post for DivorceAngels.com about: "${topic}"

Category: ${category}
${angle ? `Tone/angle: ${angle}` : ''}

Requirements:
- Write in a warm, empathetic tone like a knowledgeable friend who has been through it
- 500-700 words
- Include a compelling intro that hooks the reader
- Use subheadings (## for H2) to break up the content
- Include practical, actionable tips
- End with an encouraging, hopeful conclusion
- Format in Markdown
- Do not include a title at the top (the CMS handles that)
- Do not be preachy or overly clinical
- Write for someone in the middle of or about to start a divorce in Canada or the US`;

      try {
        const response = await fetch('/.netlify/functions/writer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, category, angle })
        });
        if (!response.ok) {
          const err = await response.text();
          result.textContent = 'Error: ' + err;
          output.classList.add('show');
          return;
        }
        const data = await response.json();
        const text = data.content || data.error || 'Sorry, something went wrong. Please try again.';
        result.textContent = text;
        output.classList.add('show');
        showImageSuggestion(category);
      } catch(e) {
        result.textContent = 'Error: ' + e.message + '. Please try again.';
        output.classList.add('show');
      }

      btn.disabled = false;
      btn.textContent = '✦ Generate blog post';
    }

    async function copyPost() {
      const text = document.getElementById('ai-result').textContent;
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('ai-copy');
      btn.textContent = '✓ Copied!';
      setTimeout(() => btn.textContent = 'Copy to clipboard', 2000);
    }

    // Unsplash image suggestions by category/keyword
    const IMAGE_POOL = {
      'Legal':        ['photo-1589829545856-d10d557cf95f','photo-1521791136064-7986c2920216','photo-1450101499163-c8848c66ca85','photo-1507925921958-8a62f3d1a50d','photo-1554224155-6726b3ff858f'],
      'Financial':    ['photo-1460925895917-afdab827c52f','photo-1579621970588-a35d0e7ab9b6','photo-1554224155-6726b3ff858f','photo-1450101499163-c8848c66ca85','photo-1460925895917-afdab827c52f'],
      'Co-Parenting': ['photo-1516627145497-ae6968895b74','photo-1484665754804-74b091211472','photo-1471286174890-9c112ffca5b4','photo-1529156069898-49953e39b3ac','photo-1488521787991-ed7bbaae773c'],
      'Emotional':    ['photo-1499209974431-9dddcece7f88','photo-1493836512294-502baa1986e2','photo-1474552226712-ac0f0961a954','photo-1528892952291-009c663ce843','photo-1518199266791-5375a83190b7'],
      'Life After':   ['photo-1506905925346-21bda4d32df4','photo-1470770903676-69b98201ea1c','photo-1501854140801-50d01698950b','photo-1545239705-1564e58b9e4a','photo-1531746020798-e6953c6e8e04'],
      'Wellness':     ['photo-1571019613454-1cb2f99b2d8b','photo-1518459031867-a89b944bffe4','photo-1476703993599-0035a21b17a9','photo-1491841550275-ad7854e35ca6','photo-1525338078858-d762b5e32f2c'],
    };

    let currentImagePool = [];
    let currentImageIndex = 0;

    function showImageSuggestion(category) {
      const pool = IMAGE_POOL[category] || IMAGE_POOL['Emotional'];
      currentImagePool = [...pool].sort(() => Math.random() - 0.5);
      currentImageIndex = 0;
      updateImage();
      document.getElementById('ai-image-suggestion').style.display = 'block';
    }

    function updateImage() {
      const id = currentImagePool[currentImageIndex % currentImagePool.length];
      const url = `https://images.unsplash.com/${id}?w=800&q=80&fit=crop`;
      document.getElementById('ai-cover-img').src = url;
      document.getElementById('ai-img-url').value = url;
    }

    function refreshImage() {
      currentImageIndex++;
      updateImage();
    }
  </script>

</body>
</html>
