[build]
  publish = "."
  functions = "netlify/functions"

# Blog routing
[[redirects]]
  from = "/blog/page/1/"
  to = "/blog/"
  status = 301

# Old WordPress pages → redirects
[[redirects]]
  from = "/divorce-professional-listings/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/promotions/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/promotions"
  to = "/"
  status = 301

[[redirects]]
  from = "/polls/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/polls"
  to = "/"
  status = 301

[[redirects]]
  from = "/events/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/events"
  to = "/"
  status = 301

[[redirects]]
  from = "/community/*"
  to = "https://www.facebook.com/groups/3705373593017325"
  status = 301

[[redirects]]
  from = "/do-it-yourself-divorce/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/vendor/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/ang-rec/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/classified/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/sign-up"
  to = "/"
  status = 301

[[redirects]]
  from = "/frequently-asked-questions/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/resources/*"
  to = "/"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
